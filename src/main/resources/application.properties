spring.application.name=xmlprocessor

# HTTP server
server.port=5000
server.ssl.enabled=false

# SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=xml_parser;encrypt=true;trustServerCertificate=true
spring.datasource.username=alanmadb
spring.datasource.password=Alan007@

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.com.example.xmlprocessor=INFO